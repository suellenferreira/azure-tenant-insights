  microsoft.batch/batchaccounts: compute/Batch_Accounts.svg
  microsoft.servicefabric/clusters: compute/Service_Fabric_Clusters.svg
  microsoft.containerservice/managedclusters: compute/Kubernetes_Services.svg
  microsoft.containerinstance/containergroups: compute/Container_Instances.svg
  microsoft.web/sites: compute/App_Services.svg
  microsoft.web/serverfarms: compute/App_Services.svg
  microsoft.web/staticsites: compute/App_Services.svg

