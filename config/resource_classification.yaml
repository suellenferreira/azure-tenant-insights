# Resource classification taxonomy (Assessment lens)
# --------------------------------------------------
# Three hierarchical tiers + a Publisher axis, used by the Excel "Classification"
# sheet, the AllResources columns, the Overview summary, and (later) the draw.io
# Service-Model / Business-Pillar diagram pages.
#
#   technical_category  — Tier 1: detailed workload category (~20 buckets)
#   business_pillar     — Tier 2: business pillar (Compute, AI, Data Platform, ...)
#   service_model       — Tier 3: IaaS | PaaS | SaaS | Hybrid | Supporting Services | Other
#   publisher           — derived in code: Microsoft (namespace microsoft.*) vs Third-party
#
# Matching precedence (see processors/classifier.py):
#   1. exact resource type (under `types:`)      e.g. microsoft.web/serverfarms
#   2. provider namespace (under `namespaces:`)  e.g. microsoft.web
#   3. non-microsoft.* namespace                 -> Third-party / Other
#   4. no rule                                   -> Other
#
# All keys MUST be lowercase. This file is fully editable — add rules as needed.

defaults:
  technical_category: "Other"
  business_pillar: "Other"
  service_model: "Other"

# Display order for the Service Model summary (Overview / Classification sheet)
service_model_order:
  - "IaaS"
  - "PaaS"
  - "SaaS"
  - "Hybrid"
  - "Supporting Services"
  - "Other"

