# Azure 2019 stencil map for the draw.io writer.
# Image paths VERIFIED against jgraph/drawio  src/main/webapp/img/lib/azure2/
# (folders: compute, networking, databases). Resource types not listed fall back
# to a colored card (so there are never broken icons).
#
# Lookup precedence (writers/drawio_writer.py): exact type -> provider namespace.

base: "img/lib/azure2"

# Generic Azure icon for any resource type without a specific or namespace match.
# Keeps the diagram fully iconified and flexible for brand-new Azure resource types.
fallback: general/All_Resources.svg

# ── Exact resource-type icons ────────────────────────────────────────────────
types:
  # Compute
  microsoft.compute/virtualmachines: compute/Virtual_Machine.svg
  microsoft.compute/virtualmachinescalesets: compute/VM_Scale_Sets.svg
  microsoft.compute/disks: compute/Disks.svg
