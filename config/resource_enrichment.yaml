# Azure Resource Enrichment Configuration
# Defines which properties to promote to named columns per resource type.
# Resources WITHOUT enrichment rules are still captured with their raw
# 'properties' blob in the AllResources sheet — nothing is silently dropped.
#
# Field paths are grounded in Microsoft official references:
# - Azure Resource Graph Resources table/resource type reference:
#   https://learn.microsoft.com/en-us/azure/governance/resource-graph/reference/supported-tables-resources
# - ARM template resource definitions under https://learn.microsoft.com/en-us/azure/templates/
#
# Keep this file declarative. Prefer official ARM/ARG property paths and leave
# fast-changing/nested details in Raw Properties unless a field is broadly useful.

resource_types:

  "microsoft.compute/virtualmachines":
    display_name: "Virtual Machines"
    promoted_fields:
