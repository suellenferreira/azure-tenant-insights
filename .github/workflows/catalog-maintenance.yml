name: Monthly catalog maintenance review

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.repository == 'suellenferreira/azure-tenant-insights'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyze catalogs
        id: catalog_review
        run: python scripts/catalog_maintenance.py docs/catalog-maintenance-report.md --github-output "$GITHUB_OUTPUT"
      - name: Publish workflow summary
        run: cat docs/catalog-maintenance-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure review label
        if: steps.catalog_review.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create catalog-review --color D4A72C --description "Catalog evidence requires maintainer review" --force
      - name: Find existing catalog review
        id: existing_review
        if: steps.catalog_review.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --state open --label catalog-review --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Notify existing review
        if: steps.catalog_review.outputs.actionable == 'true' && steps.existing_review.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.existing_review.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "A new monthly catalog analysis found actionable items. Review the latest workflow summary: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Open review pull request
        if: steps.catalog_review.outputs.actionable == 'true' && steps.existing_review.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/catalog-review-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/catalog-maintenance-report.md
          git commit -m "chore: monthly catalog maintenance review"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --label catalog-review \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Monthly catalog maintenance review" \
            --body "Review the actionable catalog findings and complete the decision/checklist in the generated report. This PR does not update catalog rules automatically."